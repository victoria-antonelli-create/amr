<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMR Ingeniería | Gestión Operativa</title>
<style>
:root{--navy:#132b49;--blue:#24558a;--red:#c83238;--bg:#f3f5f8;--line:#e1e6ed;--muted:#718096;--green:#18845b}*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Arial;color:#1e293b;background:var(--bg)}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--navy);color:#fff;padding:20px 14px;flex-shrink:0}.brand{padding:5px 8px 20px;border-bottom:1px solid #ffffff2b;font-weight:800}.brand b{font-size:25px;color:#f04449}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#d5dfec}.demo{margin:16px 4px;padding:9px;border:1px solid #ffffff35;background:#fff1;border-radius:8px;color:#ffe1a0;font-size:11px}.navlabel{font-size:10px;letter-spacing:1px;color:#9fb1c8;margin:18px 9px 7px}.nav button{width:100%;display:block;text-align:left;padding:11px 12px;margin:2px 0;border:0;border-radius:8px;color:#d8e2ef;background:none;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff20;color:#fff}.main{flex:1;min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);height:64px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;color:var(--navy);font-weight:700}.content{max-width:1350px;margin:auto;padding:26px}.eyebrow{color:var(--blue);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:800}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:7px 0 22px}.heading h1{margin:0;color:var(--navy);font-size:26px}.sub,.muted{color:var(--muted)}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:white;cursor:pointer;font-weight:650}.btn.red{background:var(--red)}.btn.light{background:#edf2f7;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:0 2px 5px #12243b08}.metric{font-size:28px;font-weight:800;color:var(--navy);margin:8px 0}.tag{display:inline-block;border-radius:20px;padding:5px 8px;background:#eef3f8;color:#42607f;font-size:11px}.tag.red{background:#fff0f0;color:#b52c32}.tag.green{background:#e9f7f0;color:#14734f}.section{margin-top:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead h2{margin:0;color:var(--navy);font-size:16px}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}td,th{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}th{font-size:10px;color:var(--muted);text-transform:uppercase;background:#fafbfd}tr:last-child td{border:0}.notice{background:#fff8e7;border:1px solid #f4dfaa;color:#775a1b;padding:11px 13px;border-radius:9px;font-size:12px;margin-bottom:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:#475569}.field input,.field select,.field textarea,.line input,.line select{font:inherit;border:1px solid #d7dee8;border-radius:8px;padding:10px;background:white;min-width:0}.field textarea{min-height:70px}.full{grid-column:1/-1}.line{display:grid;grid-template-columns:2fr .8fr .8fr 1fr auto;gap:8px;padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;margin:8px 0;align-items:end}.line label{font-size:11px;color:var(--muted)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.empty{text-align:center;padding:32px;color:var(--muted)}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.app{display:block}.side{width:100%;padding:10px}.brand{padding:4px 8px 10px}.demo{margin:8px 4px}.nav{display:flex;overflow:auto;gap:3px}.navlabel{display:none}.nav button{white-space:nowrap;width:auto;padding:9px}.top{height:52px;padding:0 14px}.content{padding:15px}.heading{align-items:flex-start;flex-direction:column}.grid{gap:8px}.card{padding:12px}.metric{font-size:23px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.line{grid-template-columns:1fr 1fr}.line .wide{grid-column:1/-1}.actions .btn{flex:1}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><b>AMR</b><br>AMR INGENIERÍA<small>GESTIÓN OPERATIVA</small></div><div class="demo">● MODO DEMOSTRACIÓN · DATOS FICTICIOS</div><div class="navlabel">OPERACIONES</div><nav class="nav" id="nav"><button class="active" data-p="inicio">⌂ Inicio</button><button data-p="obras">▦ Obras</button><button data-p="nuevo">＋ Nuevo pedido de obra</button><button data-p="compras">▤ Bandeja de Compras</button><button data-p="ordenes">▣ Compras y órdenes</button><button data-p="entregas">⇄ Entregas</button><button data-p="stock">▥ Depósito y stock</button><div class="navlabel">GESTIÓN</div><button data-p="presupuestos">＄ Presupuestos</button><button data-p="tecnica">⌁ Oficina Técnica</button><button data-p="proveedores">♧ Proveedores</button><button data-p="usuarios">♙ Usuarios y permisos</button></nav></aside><main class="main"><header class="top"><span id="top">Panel de gestión</span><span class="muted">Compras · Demo</span></header><div class="content" id="view"></div></main></div>
<script>
const demo=[{id:"SOL-0268",work:"Clínica Centro",date:"19/11/2026",need:"24/11/2026",priority:"Alta",status:"Nuevo por revisar",items:[["Cable unipolar 2,5 mm²",300,"m"],["Térmica bipolar 16 A",12,"un"]]},{id:"SOL-0267",work:"Edificio Mendoza",date:"18/11/2026",need:"22/11/2026",priority:"Normal",status:"En revisión",items:[["Bandeja portacable 100 mm",18,"m"],["Caja estanca 10x10",25,"un"]]}];let requests=JSON.parse(localStorage.getItem("amr-demo-requests")||"null")||demo;let page="inicio",selected=null;const $=s=>document.querySelector(s);
function save(){localStorage.setItem("amr-demo-requests",JSON.stringify(requests))}
function go(p){page=p;document.querySelectorAll("[data-p]").forEach(b=>b.classList.toggle("active",b.dataset.p===p));render()}
$("#nav").addEventListener("click",e=>{let b=e.target.closest("[data-p]");if(b)go(b.dataset.p)});
function head(k,t,s){return '<div class="eyebrow">AMR Ingeniería / '+k+'</div><div class="heading"><div><h1>'+t+'</h1><div class="sub">'+s+'</div></div></div>'}
function table(){return '<div class="tablewrap"><table><thead><tr><th>Número</th><th>Obra</th><th>Fecha</th><th>Requerido</th><th>Prioridad</th><th>Estado</th><th></th></tr></thead><tbody>'+requests.map(r=>'<tr><td><b>'+r.id+'</b></td><td>'+r.work+'</td><td>'+r.date+'</td><td>'+r.need+'</td><td>'+r.priority+'</td><td><span class="tag '+(r.status==="Nuevo por revisar"?"red":"green")+'">'+r.status+'</span></td><td><button class="btn light" onclick="openReq(\''+r.id+'\')">Ver</button></td></tr>').join("")+'</tbody></table></div>'}
function render(){let html="";
if(page==="inicio"){html=head("Resumen","Panel de gestión","Actividad operativa de AMR Ingeniería.")+'<div class="grid"><div class="card"><div class="muted">Obras activas</div><div class="metric">8</div><span class="tag">En ejecución</span></div><div class="card"><div class="muted">Pedidos por revisar</div><div class="metric">'+requests.filter(x=>x.status==="Nuevo por revisar").length+'</div><span class="tag red">Requieren atención</span></div><div class="card"><div class="muted">Órdenes en curso</div><div class="metric">14</div><span class="tag">Demo</span></div><div class="card"><div class="muted">Entregas pendientes</div><div class="metric">6</div><span class="tag">Seguimiento</span></div></div><div class="section"><div class="sectionhead"><h2>Pedidos recientes</h2><button class="btn light" onclick="go(\'compras\')">Ver bandeja</button></div>'+table()+'</div><div class="section card"><button class="btn" onclick="go(\'nuevo\')">＋ Crear pedido de obra</button></div>'}
else if(page==="nuevo"){html=head("Obras / Pedidos","Nuevo pedido de materiales","Los materiales se conservan como renglones originales y aparecen en Compras.")+'<div class="notice">Modo demostración. Los pedidos quedan guardados solamente en este navegador; todavía no se envían a Supabase.</div><div class="card"><div class="formgrid"><div class="field"><label>Obra *</label><select id="work"><option value="">Seleccionar...</option>'+["Clínica Centro","Edificio Mendoza","Congelados del Sur","Torre Laprida"].map(x=>'<option>'+x+'</option>').join("")+'</select></div><div class="field"><label>Fecha requerida *</label><input id="need" type="date" value="2026-11-24"></div><div class="field"><label>Prioridad</label><select id="priority"><option>Normal</option><option>Alta</option><option>Urgente</option></select></div><div class="field"><label>Destino</label><select id="dest"><option>Directo a obra</option><option>Depósito central</option></select></div><div class="field full"><label>Observaciones</label><textarea id="notes" placeholder="Indicaciones para Compras"></textarea></div></div><div class="sectionhead section"><h2>Materiales</h2><button class="btn light" onclick="addLine()">＋ Agregar</button></div><div id="lines"></div><div class="actions"><button class="btn light" onclick="go(\'inicio\')">Cancelar</button><button class="btn red" onclick="submit()">Enviar pedido a Compras →</button></div></div>';setTimeout(()=>addLine("Cable unipolar 2,5 mm²","300","m"),0)}
else if(page==="compras"){html=head("Compras","Bandeja de pedidos","Pedidos remitidos por las obras para su revisión.")+table()}
else if(page==="detalle"){let r=requests.find(x=>x.id===selected);html=head("Compras / Detalle","Pedido "+r.id,r.work+" · Solicitado "+r.date)+'<div class="card"><b>'+r.work+'</b><p class="muted">Fecha requerida: '+r.need+' · Prioridad: '+r.priority+'</p><span class="tag red">'+r.status+'</span><h3>Renglones originales</h3><div class="tablewrap"><table><thead><tr><th>Material</th><th>Cantidad</th><th>Unidad</th></tr></thead><tbody>'+r.items.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td></tr>').join("")+'</tbody></table></div><div class="actions"><button class="btn light" onclick="go(\'compras\')">Volver</button><button class="btn light" onclick="mark(\'Devuelto para aclaración\')">Solicitar aclaración</button><button class="btn" onclick="mark(\'Revisado para cotizar\')">Listo para cotizar</button></div></div>'}
else{let d={obras:["Obras","Obras activas y ficha de cada obra."],ordenes:["Compras y órdenes","Órdenes agrupadas por proveedor."],entregas:["Entregas","Recepciones parciales y entregas a obra."],stock:["Depósito y stock","Existencias y movimientos físicos."],presupuestos:["Presupuestos","Presupuestos vinculados a clientes y obras."],tecnica:["Oficina Técnica","Cómputos, documentos y revisiones."],proveedores:["Proveedores","Directorio de proveedores."],usuarios:["Usuarios y permisos","Perfiles y asignación de sectores."]}[page]||["Módulo","En preparación"];html=head("Gestión",d[0],d[1])+'<div class="card empty">Este módulo se incorporará al circuito operativo de AMR.<p><span class="tag">Vista de demostración</span></p></div>'}
$("#view").innerHTML=html;$("#top").textContent=({inicio:"Panel de gestión",nuevo:"Crear pedido de obra",compras:"Bandeja de Compras",detalle:"Detalle de pedido"}[page]||page)}
function addLine(name="",qty="",unit="un"){let x=document.createElement("div");x.className="line";x.innerHTML='<div class="wide"><label>Material / descripción</label><input class="mat" placeholder="Ej. Cable unipolar 4 mm²" value="'+name+'"></div><div><label>Cantidad</label><input class="qty" type="number" min=".01" step=".01" value="'+qty+'"></div><div><label>Unidad</label><select class="unit">'+["un","m","kg","rollo","caja"].map(u=>'<option '+(u===unit?"selected":"")+'>'+u+'</option>').join("")+'</select></div><button class="btn light" onclick="this.parentElement.remove()">✕</button>';$("#lines").appendChild(x)}
function submit(){let work=$("#work").value,need=$("#need").value,items=[...document.querySelectorAll(".line")].map(x=>[x.querySelector(".mat").value.trim(),Number(x.querySelector(".qty").value),x.querySelector(".unit").value]);if(!work||!need||!items.length||items.some(x=>!x[0]||!x[1]||x[1]<=0)){alert("Completá obra, fecha y materiales con cantidades válidas.");return}let n=269+requests.length-2;requests.unshift({id:"SOL-"+String(n).padStart(4,"0"),work,date:new Date().toLocaleDateString("es-AR"),need:new Date(need+"T00:00:00").toLocaleDateString("es-AR"),priority:$("#priority").value,status:"Nuevo por revisar",items,notes:$("#notes").value,dest:$("#dest").value});save();go("compras")}
function openReq(id){selected=id;go("detalle")}function mark(s){requests.find(x=>x.id===selected).status=s;save();go("compras")}
render();
</script></body></html>
